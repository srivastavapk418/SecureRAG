version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: eka-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  ollama:
    image: ollama/ollama:latest
    container_name: eka-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  ai-service:
    build:
      context: ./ai-service
    container_name: eka-ai-service
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434
      VECTOR_DB_PATH: /app/data/chroma
      SHARED_UPLOAD_DIR: /shared/documents
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.1:8b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      # Optional Azure OpenAI (Zero Data Retention) settings for cloud deployment
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_CHAT_DEPLOYMENT: ${AZURE_OPENAI_CHAT_DEPLOYMENT:-gpt-4o-mini}
      AZURE_OPENAI_EMBED_DEPLOYMENT: ${AZURE_OPENAI_EMBED_DEPLOYMENT:-text-embedding-3-small}
    volumes:
      - document_storage:/shared/documents
      - chroma_data:/app/data/chroma
    ports:
      - "8000:8000"

  backend:
    build:
      context: ./backend
    container_name: eka-backend
    restart: unless-stopped
    depends_on:
      - mongodb
      - ai-service
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/enterprise_knowledge_assistant
      CLIENT_URL: http://localhost:5173
      APP_URL: http://localhost:5000
      AI_SERVICE_URL: http://ai-service:8000
      UPLOAD_DIR: /shared/documents
      JWT_SECRET: ${JWT_SECRET:-please-change-in-production}
      ADMIN_BOOTSTRAP_KEY: ${ADMIN_BOOTSTRAP_KEY:-bootstrap-local-admin}
    volumes:
      - document_storage:/shared/documents
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:5000/api/v1
    container_name: eka-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mongodb_data:
  ollama_data:
  chroma_data:
  document_storage:
